    Experience:
      - company: TikTok Search (ByteDance)
        position: AI Research Intern
        location: Singapore
        start_date: "2026"
        end_date: Present
        summary:
          "Agentic Search and Tako: scenario-aware agent policies, evidence-driven
          system iteration, and ongoing model-training design."
        highlights:
          - "Led Auto-Skill policy iteration: failure diagnosis, bounded strategy changes,
            versioned experiments, and evaluation of the delivered search experience."
          - Developed scenario-specific prompts while preserving shared planning and response
            contracts.
          - Ongoing data work - faithful trajectories that distinguish model-visible evidence,
            agent actions, runtime repairs, and final rendered outcomes.
          - Ongoing training and evaluation design - compare SFT, reinforcement learning,
            and on-policy distillation; evaluate agent behavior and product quality separately.
      - company: TikTok Shop (ByteDance)
        position: AI Research Intern
        location: Singapore
        start_date: "2026-01-01"
        end_date: "2026-06-01"
        summary:
          Led FIRE, EvoA, and APA from design to production within five months,
          working with business and infrastructure partners on integration and rollout.
        highlights:
          - FIRE - designed a reusable skill-based agent harness with semantic routing,
            progressive context loading, and governed tool execution for e-commerce workflows.
          - EvoA - built an autonomous model-iteration loop combining diagnosis, pilot
            experiments, validation gates, and reusable experiment memory; reduced the
            human audit rate by approximately 4.6% relative in a controlled online experiment.
          - APA - built evidence-driven risk discovery using joint content / product signals,
            scoped expansion, deduplication, and provenance-aware review; expanded candidate
            throughput approximately 17-fold in workflow measurements.
          - Owned architecture, implementation, experimentation, evaluation, and cross-team
            integration.
      - company: Show Lab, National University of Singapore
        position: Ph.D. Researcher
        location: Singapore
        start_date: "2023-01-01"
        end_date: Present
        summary:
          Research on grounded agent recovery, reliable supervision, evolving
          state, and continual model adaptation.
        highlights:
          - ReGRPO - grounded reflection and corrective tool use; accepted at ECCV 2026.
          - SGRC, StateTrackBench, and PathComp - first-author submissions under review
            at ICLR 2027.
          - POU-OPD - first-author submission under review at AAAI.
          - Four first-author or co-first-author conference papers across ICLR, IJCAI,
            AAAI, and ECCV; TaCA is an additional preprint.
      - company: Tencent ARC Lab - Compatible Representation Learning
        position: AI Research Intern
        location: Shenzhen, China
        start_date: "2020"
        end_date: "2023"
        summary:
          Backward-compatible representation learning and model upgrades for
          large-scale image and video retrieval systems.
        highlights:
          - First-author / co-first-author work at ICLR 2022, IJCAI 2022 (long oral),
            and AAAI 2023, plus the TaCA preprint.
          - Designed compatible model upgrades that accelerate production hot updates
            and reduce feature-refresh cost for image and video retrieval.
          - Built distributed contrastive / CLIP-style training pipelines and regression-alleviating
            compatible learning methods.
          - Recipient of the Tencent Technology Breakthrough Award and SZCCF Science and
            Technology Award.
      - company: Tencent ARC Lab - Cross-Modality Video Understanding
        position: AI Research Intern
        location: Shenzhen, China
        start_date: "2019"
        end_date: "2020"
        summary:
          Multimodal models for video-text retrieval and temporal grounding on
          large-scale video-language datasets; built the PyTorch data / training / evaluation
          codebase for the group's multi-modal research.
