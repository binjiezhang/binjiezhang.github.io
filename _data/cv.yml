  summary:
    Fourth-year Ph.D. candidate at Show Lab, National University of Singapore,
    advised by Prof. Mike Zheng Shou. Research focuses on LLM agents, multimodal understanding,
    and continual / compatible learning. Four first-author or co-first-author conference
    papers at ICLR, IJCAI, AAAI, and ECCV; three production agent systems delivered
    at TikTok Shop within five months. Currently working on Agentic Search at TikTok
    Search.
