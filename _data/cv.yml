    Experience:
      - company: TikTok (ByteDance)
        position: AI Research Intern
        location: Singapore
        start_date: 2026-01-01
        end_date: 2026-06-01
        summary: >
          Sole owner of three production LLM-agent systems plus a memory research line for
          large-scale e-commerce governance, end-to-end from design to deployment.
        highlights:
          - Designed a declarative, skill-based agent harness with LLM semantic routing and progressive disclosure for rapidly composing new agents.
          - Built an agent-native self-evolving training loop (Diagnose, Hypothesize, Pilot, Gate, Train, Reflect) on top of internal training / data / monitoring / deployment platforms.
          - Designed an LLM-as-judge patrol agent for risk discovery, combining multi-source signals with entity-graph diffusion and an evidence-gated feedback loop.
          - Researched training-free optimization of agent memory (retrieval, write, eviction) and context management for long-horizon tool-use agents.
          - End-to-end ownership - design, implementation, cross-team integration, review, and production rollout, after ramping into the agent stack within two weeks.

      - company: Show Lab, National University of Singapore
        position: Ph.D. Researcher
        location: Singapore
        start_date: 2023-01-01
        end_date: Present
        summary: >
          Research on LLM agents, world / predictive models, and lifelong / compatible
          representation learning.
        highlights:
          - Reflection-augmented policy optimization for tool-using agents (ReGRPO, ECCV 2026).
          - Path-anchored compatibility for lifelong vision-language-action adaptation (PathComp).
          - Egocentric future prediction conditioned on hand trajectories (Ego-PM).
          - Conflict-aware attribution for multi-hop retrieval-augmented generation (cLOO).

      - company: Tencent ARC Lab - Compatible Representation Learning
        position: AI Research Intern
        location: Shenzhen, China
        start_date: 2020-01-01
        end_date: 2023-01-01
        summary: >
          Backward-compatible representation learning and model upgrades for large-scale image
          and video retrieval systems.
        highlights:
          - Four first-author papers (ICLR'22, IJCAI'22 long oral, AAAI'23, arXiv'23) defining the team's backward-compatible retrieval line.
          - Multi-GPU contrastive / CLIP-style training pipelines with regression-alleviating methods enabling hot-refresh upgrades without re-encoding billion-scale galleries.
          - Winner of the Tencent Technology Breakthrough Award (2022).

      - company: Tencent ARC Lab - Cross-Modality Video Understanding
        position: AI Research Intern
        location: Shenzhen, China
        start_date: 2019-01-01
        end_date: 2020-01-01
        summary: >
          Multimodal models for video-text retrieval and temporal grounding on large-scale
          video-language datasets; built the PyTorch data / training / evaluation codebase
          for the group's multi-modal research.

